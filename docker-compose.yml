# Toda la configuración sale del archivo .env (copia .env.example)
services:
  db:
    image: postgres:17-alpine
    container_name: michi-casino-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Define DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      POSTGRES_DB: ${DB_NAME:?Define DB_NAME en .env}
      TZ: ${TIMEZONE}
    ports:
      - "${DB_PORT:?Define DB_PORT en .env}:5432"
    volumes:
      - michi_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: michi-casino:latest
    container_name: michi-casino-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      DATABASE_SSL: ${DATABASE_SSL}
      PORT: ${PORT:?Define PORT en .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Define ADMIN_USERNAME en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env}
      TIMEZONE: ${TIMEZONE}
      TZ: ${TIMEZONE}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION}
      COOKIE_SECURE: ${COOKIE_SECURE}
      TRUST_PROXY: ${TRUST_PROXY}
    ports:
      - "${APP_PORT:?Define APP_PORT en .env}:${PORT}"

volumes:
  michi_data:
