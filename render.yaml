# Blueprint de Render: crea la base de datos y el web service (Docker) de una sola vez.
# Render → New → Blueprint → elige este repositorio.
databases:
  - name: michi-casino-db
    databaseName: michi_casino
    user: michi
    plan: free
    region: oregon

services:
  - type: web
    name: michi-casino
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: michi-casino-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: TIMEZONE
        value: America/Bogota
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: ADMIN_RESET_PASSWORD
        value: "false"
      - key: RECOVERY_QUESTION
        value: ¿Cómo se llama mi jugador de fútbol favorito?
      - key: RECOVERY_OPTIONS
        value: Cristiano,Messi,Mbappé,Yamal
      # La respuesta no va en el repositorio público: se escribe en el panel de Render
      - key: RECOVERY_ANSWER
        sync: false
